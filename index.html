<!DOCTYPE html>
<!-- Declaración del tipo de documento HTML5 -->
<html lang="es">
<head>
  <!-- Configuración de caracteres para soportar acentos y la letra 'ñ' -->
  <meta charset="UTF-8">
  <!-- Meta etiqueta responsiva: asegura que la página se escale correctamente en móviles y computadoras -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Proyecto Minimalista</title>

  <!-- Enlace al archivo CSS de Bootstrap 5.3 desde CDN (estilos y utilidades) -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<!-- 
  Clases en <body>:
  - d-flex flex-column: Convierte el cuerpo en un contenedor Flexbox vertical.
  - min-vh-100: Garantiza que el alto del cuerpo ocupe al menos el 100% de la altura de la pantalla (Viewport Height).
  - bg-light: Fondo gris muy claro para un aspecto limpio.
  - text-dark: Texto principal en tono oscuro/casi negro.
-->
<body class="d-flex flex-column min-vh-100 bg-light text-dark">

  <!-- ==========================================
       BARRA DE NAVEGACIÓN (NAVBAR)
       ========================================== -->
  <!-- 
    - navbar: Aplica los estilos base de navegación.
    - navbar-expand-lg: Muestra el menú completo en pantallas grandes (desktop) y colapsa en botón en móviles.
    - navbar-light bg-white: Fondo blanco con colores de texto legibles para fondos claros.
    - border-bottom: Añade una línea divisoria inferior muy tenue.
  -->
  <nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom">
    <!-- container: Centra el contenido y le da márgenes laterales automáticos -->
    <div class="container">
      
      <!-- Logo o título principal de la marca -->
      <!-- fw-bold: Aplica grosor de fuente en negrita (Font Weight Bold) -->
      <a class="navbar-brand fw-bold" href="#">Instituto Tecnológico Superior de Lerdo</a>

      <!-- Botón tipo "hamburguesa" que aparece únicamente en pantallas pequeñas -->
      <!-- data-bs-toggle y data-bs-target vinculan este botón con el div colapsable mediante JavaScript -->
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Menú desplegable que contiene los enlaces de navegación -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <!-- ms-auto: (Margin Start Auto) Empuja la lista de enlaces totalmente hacia la derecha -->
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Inicio</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Servicios</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Contacto</a></li>
        </ul>
      </div>

    </div>
  </nav>

  <!-- ==========================================
       SECCIÓN PRINCIPAL (HERO)
       ========================================== -->
  <!-- 
    - container: Alinea y limita el ancho del contenido principal.
    - my-auto: (Margin Y Auto) Centra verticalmente este contenedor dentro del espacio disponible del Flexbox.
    - py-5: (Padding Y) Añade un relleno arriba y abajo (nivel 5).
    - text-center: Centra todo el texto dentro del elemento.
  -->
  <main class="container my-auto py-5 text-center">
    <!-- row justify-content-center: Sistema de rejilla centrado horizontalmente -->
    <div class="row justify-content-center">
      <!-- col-md-8: En pantallas medianas y superiores ocupa 8 de 12 columnas (para no hacer el texto demasiado ancho) -->
      <div class="col-md-8">
        
        <!-- display-4: Tipografía de gran tamaño y estilo para títulos destacados -->
        <!-- mb-3: Margen inferior nivel 3 -->
        <h1 class="display-4 fw-bold mb-3">Diseño simple y funcional</h1>
        
        <!-- lead: Aumenta ligeramente el tamaño del texto para dar aspecto de subtítulo -->
        <!-- text-muted: Aplica un color de fuente gris atenuado -->
        <!-- mb-4: Margen inferior nivel 4 -->
        <p class="lead text-muted mb-4">
          Una base sólida y limpia lista para escalar según las necesidades del proyecto.
        </p>
        
        <!-- btn btn-dark: Botón estilizado con fondo oscuro -->
        <!-- btn-lg: Botón de tamaño grande -->
        <!-- px-4: Padding horizontal interno nivel 4 -->
        <button class="btn btn-dark btn-lg px-4">Saber más</button>
        
      </div>
    </div>
  </main>

  <!-- ==========================================
       PIE DE PÁGINA (FOOTER)
       ========================================== -->
  <!-- 
    - py-3: Padding vertical nivel 3.
    - bg-white: Fondo blanco.
    - border-top: Borde superior muy tenue para separar del contenido.
    - text-muted: Texto gris atenuado.
  -->
  <footer class="py-3 bg-white border-top text-center text-muted">
    <div class="container">
      <small>&copy; 2026 ProyectoBase. Todos los derechos reservados.</small>
    </div>
  </footer>

  <!-- Archivo JavaScript oficial de Bootstrap 5.3 (necesario para la funcionalidad del botón de menú desplegable) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
